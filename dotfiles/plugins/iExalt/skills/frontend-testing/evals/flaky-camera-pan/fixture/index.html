<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Org map</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #map { position: relative; width: 800px; height: 500px; overflow: hidden; background: #f4f4f4; }
  #world { position: absolute; left: 0; top: 0; width: 2000px; height: 1200px; }
  .node { position: absolute; width: 90px; height: 40px; border-radius: 6px; background: #4a7;
          color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .node.selected { outline: 3px solid #135; }
  #inspector { position: absolute; right: 0; top: 0; width: 220px; padding: 12px; background: #fff;
               border-left: 1px solid #ccc; height: 476px; display: none; }
</style>
</head>
<body>
<div id="map"><div id="world"></div><aside id="inspector"><h2 id="inspector-title"></h2></aside></div>
<script src="app.js"></script>
</body>
</html>
